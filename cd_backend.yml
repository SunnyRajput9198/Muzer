name: Deploy the backend
on:
  push:
    branches: [ main ]

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push 
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./muzer/Dockerfile.dev   # change if path is wrong
          push: true
          tags: sunnyrajput9198/todo-app-backend:${{ github.sha }}

      - name: Deploy to the VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@64.227.169.180 -t "
            docker rm -f user_backend || true &&
            docker run --name user_backend -d -p 3000:3000 sunnyrajput9198/todo-app-backend:${{ github.sha }}
          "
